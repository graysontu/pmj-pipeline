name: Pipeline Watchdog

# Runs after a failed run of the daily pipeline, the LinkedIn job or the Pages
# deploy, and handles what those workflows can't handle themselves - so that
# GitHub's own "Run failed" emails can be turned off without missing anything
# (Grayson, 2026-10-05). The decision logic is in .github/scripts/watchdog-decide.sh:
#
# - When GitHub cannot allocate a hosted runner, a job is cancelled before ANY
#   step executes, so a workflow's own "Send failure email" step never fires.
#   Those runs are retried (up to 3 attempts) without an email; an email goes out
#   only if the retries run out - for LinkedIn, only if no LinkedIn run worked in
#   the last 20 hours, since each posting day has three runs.
# - Ordinary step failures in the pipeline and LinkedIn workflows are left alone:
#   they email themselves, and retrying real code failures burns Anthropic credits.
# - Deploy Pages has no email of its own and costs nothing to retry, so any
#   failure there is retried, and emailed only if the feed still isn't published.
#
# Retrying the pipeline matters because JOB_MAX_AGE_DAYS=2 means two consecutive
# missed runs permanently drop the jobs published in between.

on:
  workflow_run:
    workflows: ["Run Pipeline", "LinkedIn Post", "Deploy Pages"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  watch:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Decide what to do
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bash .github/scripts/watchdog-decide.sh

      - name: Retry the run
        if: steps.decide.outputs.action == 'retry'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}

      - name: Email about the failure
        if: steps.decide.outputs.action == 'email'
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.decide.outputs.subject }}
          to: turleygrayson@gmail.com
          from: PMJ Pipeline <${{ secrets.GMAIL_USERNAME }}>
          body: ${{ steps.decide.outputs.body }}
