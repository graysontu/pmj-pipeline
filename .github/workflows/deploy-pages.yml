name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "output/feed.xml"
      - "output/feed_test.xml"
      - "output/feed_minimal.xml"
      - "output/feed_diagnostic.xml"
      - "output/logos/**"
  workflow_run:
    workflows: ["Run Pipeline"]
    types: [completed]
  # Manual publish from the Actions tab (or `gh workflow run deploy-pages.yml`).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: output/
          # One artifact name per attempt. A re-run keeps the earlier attempts'
          # artifacts, and deploy-pages refuses to choose between several with the
          # same name, so with a fixed name every retry of a run failed
          # ("Multiple artifacts named github-pages", 2026-11-18).
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
