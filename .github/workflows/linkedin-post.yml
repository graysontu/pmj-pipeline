name: LinkedIn Post

# Picks one job from the feed, draws its image and writes its caption, then
# schedules it on the LinkedIn company page through Buffer. Runs Monday,
# Wednesday and Friday; the post is scheduled for LINKEDIN_POST_TIME (10:00 AM
# Eastern), so a late-starting cron doesn't move it.
#
# Everything it writes goes to the linkedin-posts branch (images, history.json
# and a README that shows every post) - never to main, so it cannot collide with
# the daily pipeline's commit. See CLAUDE.md, "LinkedIn posts".

on:
  schedule:
    - cron: "17 12 * * 1,3,5"   # 8:17 AM EDT / 7:17 AM EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-post
  cancel-in-progress: false

env:
  # The one switch. "false" is preview mode: each run picks, draws and records
  # the post on the linkedin-posts branch but sends nothing to Buffer. "true"
  # schedules real posts. Flip back to "false" to stop posting.
  LINKEDIN_POSTING_ENABLED: "true"

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Check out the post log branch
        uses: actions/checkout@v4.2.2
        with:
          ref: linkedin-posts
          path: linkedin-posts

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick the job and draw the post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.linkedin prepare --dir linkedin-posts --email-dir linkedin-email

      # Buffer fetches the image from a public URL, so it has to be pushed
      # before the post is scheduled.
      - name: Publish the image
        working-directory: linkedin-posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Prepare LinkedIn post $(date -u +%Y-%m-%d)"
          git push origin HEAD:linkedin-posts

      - name: Schedule in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python -m pipeline.linkedin publish --dir linkedin-posts --email-dir linkedin-email

      - name: Record the post
        working-directory: linkedin-posts
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "Record LinkedIn post $(date -u +%Y-%m-%d)"
          git push origin HEAD:linkedin-posts

      # No email when there was nothing to report (a post already scheduled today).
      - name: Read email subject
        id: email
        run: |
          if [ -f linkedin-email/subject.txt ]; then
            echo "subject=$(cat linkedin-email/subject.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Send post email
        if: steps.email.outputs.subject != ''
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.email.outputs.subject }}
          to: turleygrayson@gmail.com
          from: PMJ Pipeline <${{ secrets.GMAIL_USERNAME }}>
          body: file://linkedin-email/body.txt

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "LinkedIn post failed"
          to: turleygrayson@gmail.com
          from: PMJ Pipeline <${{ secrets.GMAIL_USERNAME }}>
          body: |
            Today's LinkedIn post was not scheduled. The job feed is unaffected.

            View the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
